<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đoán nhân vật qua bóng đen</title><style>body{margin:0;background:linear-gradient(135deg,#122b57,#176db0);color:#fff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:24px}.card{background:#ffffff17;border:1px solid #ffffff44;border-radius:22px;padding:22px;margin:15px 0;text-align:center}h1{font-size:clamp(26px,5vw,44px)}button,input{font:inherit;padding:13px 18px;border-radius:12px;border:0;margin:6px}button{background:#ffd04d;color:#182642;font-weight:700;cursor:pointer}button:disabled{opacity:.4}input{max-width:230px}img.character{height:260px;max-width:100%;object-fit:contain;border-radius:16px}#qr{background:white;padding:10px;width:190px;height:190px;margin:10px auto}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices button{min-height:55px}.muted{opacity:.85}.hidden{display:none}.success{color:#8fffbb}.error{color:#ffb2b2}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ffffff44;text-align:left}a{color:#ffe18b}@media(max-width:500px){.choices{grid-template-columns:1fr}img.character{height:210px}}</style></head><body><main><h1>🎭 Đoán nhân vật qua bóng đen</h1><p class="muted">Quét QR • Thi đấu trực tiếp • Xếp hạng theo điểm và thời gian</p><div id="home" class="card"><button onclick="create()">🎓 Tôi là giáo viên – Tạo phòng</button><div><input id="code" placeholder="Mã phòng 6 số" inputmode="numeric"><input id="name" placeholder="Tên học sinh" maxlength="32"><button onclick="join()">Tham gia</button></div></div><div id="host" class="card hidden"><h2>Phòng <span id="room"></span></h2><div id="qr"></div><p>Quét mã QR hoặc vào <a id="joinlink" target="_blank"></a></p><button id="start" onclick="act('start')">Bắt đầu</button><button id="next" class="hidden" onclick="act('next')">Câu tiếp theo ➜</button><button id="reset" class="hidden" onclick="act('reset')">Chơi lại</button></div><div id="game" class="card hidden"><h2 id="progress"></h2><p id="timer"></p><h2 id="prompt">Đây là nhân vật nào?</h2><img id="picture" class="character" alt="Bóng nhân vật"><div id="choices" class="choices"></div><p id="feedback"></p><button id="music" class="hidden" onclick="toggleMusic()">⏸ Tạm dừng nhạc</button></div><div id="ranking" class="card hidden"><h2>🏆 Bảng xếp hạng trực tiếp</h2><table><thead><tr><th>Hạng</th><th>Học sinh</th><th>Điểm</th><th>Thời gian</th></tr></thead><tbody id="rows"></tbody></table></div><p id="notice"></p></main><audio id="audio" loop></audio><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),names=['Doraemon','Conan','Tom','Minion'],files=['doraemon','conan','tom','minion'];let role='',code='',token='',answered=false,current=-1,played=-1,latest=null;const el=id=>document.getElementById(id),show=(id,on)=>el(id).classList.toggle('hidden',!on);const note=t=>el('notice').textContent=t;const asset=(n,k)=>'/assets/'+files[n]+'_'+k+'.png';
function create(){socket.emit('create',{},r=>{if(!r.ok)return note('Không thể tạo phòng');role='host';code=r.code;show('home',false);show('host',true);show('ranking',true);el('room').textContent=code;const url=location.origin+'/?room='+code;el('joinlink').textContent=url;el('joinlink').href=url;const q=el('qr');q.innerHTML='';const qrImage=document.createElement('img');qrImage.src='/qr.svg?room='+encodeURIComponent(code);qrImage.alt='Mã QR tham gia phòng '+code;qrImage.width=190;qrImage.height=190;qrImage.style.display='block';qrImage.onerror=()=>{q.textContent='Không tải được mã QR. Học sinh sử dụng đường dẫn bên dưới.'};q.appendChild(qrImage)})}
function join(){const c=el('code').value.trim(),n=el('name').value.trim();socket.emit('join',{code:c,name:n,token:sessionStorage.getItem('gameToken')||''},r=>{if(!r.ok)return note(r.error);role='student';code=c;token=r.token;sessionStorage.setItem('gameToken',token);show('home',false);show('ranking',true);note('Đã vào phòng. Chờ giáo viên bắt đầu!')})}
function act(action){socket.emit(action,{},r=>{if(!r?.ok)note(r?.error||'Không thể thực hiện thao tác')})}
function stopMusic(){const a=el('audio');a.pause();a.currentTime=0;show('music',false);played=-1}
function playMusic(index){if(played===index)return;const a=el('audio');a.src='/assets/'+files[index]+'.mp3';a.loop=true;played=index;a.play().catch(()=>note('Chạm nút Phát nhạc để nghe trên thiết bị này.'));show('music',true);el('music').textContent='⏸ Tạm dừng nhạc'}
function toggleMusic(){const a=el('audio');if(a.paused){a.play().catch(()=>{});el('music').textContent='⏸ Tạm dừng nhạc'}else{a.pause();el('music').textContent='▶ Phát nhạc'}}
function answer(n){if(answered||!latest||latest.phase!=='question')return;socket.emit('answer',{choice:n},r=>{if(!r?.ok)return;answered=true;el('feedback').textContent=r.correct?'🎉 Chính xác! +'+(r.score)+' tổng điểm':'❌ Chưa chính xác. Đáp án là '+r.answer;el('feedback').className=r.correct?'success':'error';el('picture').src=asset(latest.index,'original');el('choices').innerHTML='';if(r.correct)playMusic(latest.index)})}
function render(r){latest=r;show('ranking',true);el('rows').innerHTML=r.leaderboard.map(p=>'<tr><td>'+p.rank+'</td><td>'+escapeHtml(p.name)+'</td><td>'+p.score+'</td><td>'+p.time.toFixed(2)+'s</td></tr>').join('');if(role==='host'){show('start',r.phase==='lobby');show('next',r.phase==='reveal');show('reset',r.phase==='finished')}
show('game',r.phase!=='lobby');if(r.phase==='lobby'){note('Đang chờ bắt đầu • '+r.players.length+' học sinh');return}if(r.phase==='finished'){stopMusic();el('progress').textContent='🎉 Hoàn thành!';el('prompt').textContent='Xem bảng xếp hạng bên dưới';show('picture',false);el('choices').innerHTML='';el('timer').textContent='';return}show('picture',true);if(current!==r.index){stopMusic();current=r.index;answered=false;el('feedback').textContent='';el('prompt').textContent='Đây là nhân vật nào?'}el('progress').textContent='Câu '+(r.index+1)+' / '+r.total;const reveal=r.phase==='reveal';el('picture').src=asset(r.index,reveal?'original':'shadow');if(reveal){el('prompt').textContent='Đáp án: '+names[r.index];el('choices').innerHTML='';if(role==='host')playMusic(r.index)}else if(role==='student'&&!answered){el('choices').innerHTML=names.map(n=>'<button onclick="answer(\''+n+'\')">'+n+'</button>').join('')}else if(role==='host'){el('choices').innerHTML=''}if(reveal&&role==='student'&&answered){el('picture').src=asset(r.index,'original')}note(r.phase==='question'?'Trả lời nhanh để được nhiều điểm!':'Giáo viên bấm Câu tiếp theo để tiếp tục.')}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
socket.on('state',render);socket.on('closed',()=>{stopMusic();note('Giáo viên đã đóng phòng. Vui lòng tải lại trang.');show('game',false)});setInterval(()=>{if(latest?.phase==='question')el('timer').textContent='⏱ Còn '+Math.max(0,Math.ceil((latest.deadline-Date.now())/1000))+' giây'},200);const p=new URLSearchParams(location.search).get('room');if(p)el('code').value=p;
</script></body></html>
